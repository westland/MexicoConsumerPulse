# Nginx Reverse Proxy Configuration for MexConsumerPulse
# Place in: /etc/nginx/sites-available/mexconsumerpulse
# Symlink: ln -s /etc/nginx/sites-available/mexconsumerpulse /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _; # Replace with your domain (e.g. pulse.yourdomain.com) or Hetzner server IP

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts for heavy scraper operations
    proxy_connect_timeout 120s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Static assets cache
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    # API and Frontend Proxy
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
